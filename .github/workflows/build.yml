name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: pip install flet==1.0.2

      - name: Compilar APK
        run: flet build apk --module-name main.py

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-APK
          path: build/apk/*.apk
